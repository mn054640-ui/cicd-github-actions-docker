name: CI/CD with Quality

on:
  push:
    branches: [ "main" ]

jobs:
  build-test-quality:
    runs-on: ubuntu-latest

    steps:

    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: Install Dependencies
      run: npm ci

    - name: Run Tests
      run: npm test

    - name: Run Code Quality (ESLint)
      run: |
        chmod +x node_modules/.bin/eslint
        npx eslint .

    - name: Build Docker Image
      run: docker build -t cicd-quality .
